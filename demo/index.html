<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>WE Learn Helper · 脱敏模拟演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2fa;color:#172747;font:16px/1.5 "Microsoft YaHei",sans-serif}header{height:104px;background:#172747;color:white;padding:21px 38px;display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:0}header p{margin:2px 0;color:#b9c6df;font-size:13px}.badge{border:1px solid #7f98ca;border-radius:30px;padding:8px 18px;color:#dbe8ff;font-size:14px}.layout{display:grid;grid-template-columns:760px 1fr;gap:24px;padding:26px 32px}.card{background:white;border:1px solid #dce4f2;border-radius:16px;padding:28px;box-shadow:0 8px 20px #17274705;min-height:422px}.eyebrow{color:#4266b5;font-size:13px;letter-spacing:2px}h2{margin:8px 0 12px;font-size:25px}.hint{color:#6b7b97;font-size:14px}.question{padding:20px;background:#f6f8fd;border-radius:12px;margin:22px 0}.row{margin:16px 0}.blank{display:inline-block;min-width:130px;border-bottom:2px solid #9cafd0;color:#215db4;padding:0 12px}.key{display:none}.choice{display:block;background:white;border:1px solid #d9e2f1;border-radius:8px;padding:9px 14px;cursor:pointer;margin:7px 0}.chosen{background:#e8f5f1!important;border-color:#29a587!important;color:#117359}.controls>span{display:inline-block;padding:12px 26px;border:1px solid #ddd;border-radius:10px;margin-right:12px}.ng-hide{display:none!important}button{cursor:pointer;border:0;border-radius:7px;padding:10px 20px;background:#315fbc;color:white;font:inherit}.reset{background:#e6f5f0;color:#117359}.queue{background:white;border-radius:14px;padding:22px}.step{padding:12px 0;border-bottom:1px solid #eef1f7;color:#667790}.step.current{color:#2658b0;font-weight:bold}.step.done{color:#13836d}.step.done:after{content:'  ✓ 已完成'}.line{height:7px;background:#e6ecf6;border-radius:10px;margin:16px 0}.bar{height:100%;background:#21a587;border-radius:10px;width:0;transition:width .4s}.status{font-size:14px;color:#697b98;min-height:70px}.result{color:#16806b;min-height:25px;font-weight:bold}.footer{position:fixed;bottom:16px;left:38px;color:#7a88a1;font-size:12px}#welearn-auto-v4{left:auto!important;right:32px!important;bottom:32px!important;width:432px!important;box-shadow:none!important;border:1px solid #bfd0ec!important;border-radius:14px!important;font-size:13px!important}#welearn-auto-v4 strong{font-size:15px}.finished{font-size:20px;color:#13836d}
body{width:1280px;height:720px;overflow:hidden}.footer{bottom:auto;top:680px}#welearn-auto-v4{left:816px!important;right:auto!important;top:520px!important;bottom:auto!important}</style>
<header><div><h1>WE Learn Helper <span style="color:#9bb9fa;font-size:17px">v4.2</span></h1><p>自动填写 · 自动提交 · 完成状态核验</p></div><div class="badge">脱敏模拟演示 · 虚构题目</div></header>
<div class="layout"><div class="card"><div class="eyebrow">AUTOMATION DEMO</div><h2 id="heading">三种题型，一次流程演示</h2><div class="hint" id="hint">演示使用模拟课件接口，不连接真实课程和账号。</div><div id="quiz"></div><div class="result" id="result"></div><div id="actions"></div></div><div><div class="queue"><strong>模拟任务列表</strong><div class="step current" id="step0">01　听力信息填空</div><div class="step" id="step1">02　阅读单项选择</div><div class="step" id="step2">03　陈述判断</div><div class="line"><div class="bar" id="bar"></div></div><div class="status" id="phase">准备就绪。点击开始即可展示实际脚本的填写和提交交互。</div><button id="start">开始脱敏演示</button></div></div></div>
<div class="footer">仅录制演示页面内容 · 无真实账号 / 班级 / 成绩 · 无桌面与浏览器界面</div>
<script>
// A small, original mock of the course control contract. No original course data is included.
let controls=new Map(),current=0,started=false;
const phase=t=>document.querySelector('#phase').textContent=t;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function render(){for(const [el,c] of controls){if(el.tagName==='ET-BLANK')el.querySelector('.blank').textContent=c.value;else{const options=[...el.querySelectorAll('li,.controls>span')];options.forEach((o,i)=>o.classList.toggle('chosen',c.value.includes(el.tagName==='ET-TOF'?(i===0?'t':'f'):i)));}}}
const root={$apply:fn=>{fn();render();},$$phase:false};
window.angular={element:el=>({controller:()=>controls.get(el)||null,injector:()=>({get:()=>root})})};
function mount(n){current=n;controls=new Map();document.querySelector('#result').textContent='';
const heading=['听力信息填空','阅读单项选择','陈述判断'][n];document.querySelector('#heading').textContent=heading;
document.querySelector('#hint').textContent=['Complete the profile using the missing information.','Choose the best habit for a balanced daily routine.','Decide whether the following statement is true or false.'][n];
const q=document.querySelector('#quiz');q.innerHTML=n===0?'<div class="question"><div class="row">Meeting place: <et-blank id="demo-place"><span class="blank"></span></et-blank></div><div class="row">Duration: <et-blank id="demo-time"><span class="blank"></span></et-blank> minutes</div><div class="row">Team colour: <et-blank id="demo-colour"><span class="blank"></span></et-blank></div></div>':n===1?'<et-choice id="demo-choice" class="question"><ol style="padding:0;list-style:none"><li class="choice">A. Read and take regular breaks</li><li class="choice">B. Skip sleep every day</li><li class="choice">C. Avoid all physical activity</li></ol></et-choice>':'<et-tof id="demo-tof" class="question"><p>Regular short breaks can help you stay focused.</p><span class="controls"><span>T — True</span><span>F — False</span></span></et-tof>';
const answers=n===0?[['library'],['20'],['green']]:n===1?[[0]]:[['t']];
[...q.querySelectorAll('et-blank,et-choice,et-tof')].forEach((el,i)=>{const c={hasKey:true,key:answers[i],multiple:false,value:el.tagName==='ET-BLANK'?'':[]};Object.defineProperty(c,'isCorrect',{get:()=>JSON.stringify(c.value)===JSON.stringify(el.tagName==='ET-BLANK'?c.key[0]:c.key)});controls.set(el,c);[...el.querySelectorAll('li,.controls>span')].forEach((o,i)=>o.onclick=()=>{c.value=[el.tagName==='ET-TOF'?(i===0?'t':'f'):i];render();});});
document.querySelector('#actions').innerHTML='<et-button id="submit-wrap"><button id="submit">Submit</button></et-button><et-button id="reset-wrap" class="ng-hide"><button class="reset">Reset</button></et-button>';
document.querySelector('#submit').onclick=async()=>{if(!window.confirm('客观题的作答只能提交一次，是否继续提交？'))return;phase('正在提交：模拟服务器保存答案…');await wait(650);document.querySelector('#submit-wrap').classList.add('ng-hide');document.querySelector('#reset-wrap').classList.remove('ng-hide');document.querySelector('#result').textContent='✓ 答案已保存 · 正确率 100%';};
for(let i=0;i<3;i++)document.querySelector('#step'+i).className='step'+(i<n?' done':i===n?' current':'');}
mount(0);
document.querySelector('#start').onclick=async()=>{if(started)return;started=true;document.querySelector('#start').hidden=true;
for(let n=0;n<3;n++){mount(n);phase('自动进入第 '+(n+1)+' 项，识别题型和答案。');await wait(1700);document.querySelector('#welearn-auto-submit').click();
for(let i=0;i<120&&!document.querySelector('#submit-wrap').classList.contains('ng-hide');i++)await wait(100);
await wait(900);phase('已提交 → 核对模拟目录中的完成状态。');await wait(1200);document.querySelector('#step'+n).className='step done';document.querySelector('#bar').style.width=((n+1)/3*100)+'%';phase('目录已确认完成，继续下一项。');await wait(1000);}
document.querySelector('#heading').textContent='演示完成：3 / 3';document.querySelector('#result').classList.add('finished');document.querySelector('#result').textContent='✓ 三类题型已填写、提交并核验';phase('完成。这里展示的是脱敏模拟流程，不是真实课程成绩。');};
</script><script src="../welearn-auto.user.js"></script></html>
